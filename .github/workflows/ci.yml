name: CI/CD

# When to run: every pull request, and every push to main (i.e. after a merge).
# CI jobs run on both; the delivery job runs only on main.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the previous, now outdated, run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Node/Express API gateway ----------
  api:
    name: API (type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20            # same as api/Dockerfile (node:20)
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci                   # exact versions from package-lock.json
      - run: npx tsc --noEmit         # type errors fail the build

  # ---------- React Native / Expo client ----------
  mobile:
    name: Mobile (type-check + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint             # expo lint; errors fail, warnings don't

  # ---------- Python game logic + ILP solver (no torch, no models) ----------
  python-logic:
    name: Python logic (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"     # same as backend/Dockerfile
      - name: Install logic dependencies only
        # Take pydantic and pulp lines straight from requirements.txt, so the
        # version constraints live in one place and cannot drift apart.
        run: |
          grep -E '^(pydantic|pulp)' backend/requirements.txt > /tmp/req-logic.txt
          cat /tmp/req-logic.txt
          pip install -r /tmp/req-logic.txt pytest
      - run: python -m pytest tests/test_logic.py -v

  # ---------- CD: build and publish Docker images (main only) ----------
  # Continuous Delivery: every merge to main that passes all CI jobs produces
  # versioned, ready-to-deploy images in GitHub Container Registry (ghcr.io).
  # Deployment to EC2 is still a manual step that pulls one of these images.
  publish-images:
    name: Publish image (${{ matrix.name }})
    needs: [api, mobile, python-logic]   # only after every CI job is green
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30                  # the Python image includes PyTorch
    permissions:
      contents: read
      packages: write                    # needed to push to ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
            dockerfile: ./api/Dockerfile
            image: rummikub-api
          - name: python-backend
            context: .
            dockerfile: ./backend/Dockerfile
            image: rummikub-python-backend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no secret to create

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # sha-<commit>: immutable, use this to deploy or roll back
          # latest: moving pointer to the newest main build
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
